services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/portao.sqlite
    volumes:
      - gate_data:/app/data
    # Sem porta 3000 publicada: o acesso externo passa pelo HTTPS do Caddy.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  gate_data:
  caddy_data:
  caddy_config:
